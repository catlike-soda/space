<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FF6B8A">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ソーダ韓国語辞書">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <title>ソーダ韓国語辞書</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
    <link rel="stylesheet" href="/css/ios-theme.css?v=3">
</head>
<body>
    <div id="app">
        <!-- Status Bar Spacer -->
        <div class="status-bar-spacer"></div>

        <!-- Navigation Bar -->
        <nav class="nav-bar" id="navBar">
            <button class="nav-back" id="navBack" onclick="history.back()" style="display:none">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1 class="nav-title" id="navTitle">ソーダ韓国語辞書</h1>
            <div class="nav-spacer"></div>
        </nav>

        <!-- Main Content -->
        <main id="mainContent">
            <!-- Pages are rendered here by app.js -->
        </main>

        <!-- Tab Bar -->
        <nav class="tab-bar" id="tabBar">
            <button class="tab-btn active" data-page="search" onclick="navigateTo('search')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <span>查词</span>
            </button>
            <button class="tab-btn" data-page="sentence" onclick="navigateTo('sentence')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span>句子</span>
            </button>
            <button class="tab-btn" data-page="favorites" onclick="navigateTo('favorites')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span>收藏</span>
            </button>
            <button class="tab-btn" data-page="settings" onclick="navigateTo('settings')">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
                <span>设置</span>
            </button>
        </nav>

        <!-- Word Detail Sheet Overlay -->
        <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>
        <div class="bottom-sheet" id="bottomSheet">
            <div class="sheet-handle"></div>
            <div class="sheet-content" id="sheetContent"></div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast"></div>
    </div>

    <script src="/js/services/api-client.js"></script>
    <script src="/js/services/local-cache.js"></script>
    <script src="/js/services/tts.js"></script>
    <script src="/js/i18n.js"></script>
    <script src="/js/components/search-page.js"></script>
    <script src="/js/components/word-detail.js"></script>
    <script src="/js/components/conjugation-table.js"></script>
    <script src="/js/components/sentence-page.js"></script>
    <script src="/js/components/favorites-page.js"></script>
    <script src="/js/components/settings-page.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/utils/pwa-register.js"></script>
</body>
</html>
